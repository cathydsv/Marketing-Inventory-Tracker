<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSV | Marketing Inventory Tracker</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <!-- DSV Corporate Header Bar -->
    <header class="dsv-navbar">
        <div class="dsv-navbar-container">
            <div class="dsv-brand">
                <img src="assets/dsv-logo.png" alt="DSV Logo" class="dsv-logo-img">
                <span class="dsv-divider">|</span>
                <span class="dsv-subtitle">Marketing Inventory Tracker</span>
            </div>
            <div class="dsv-status-badge">
                <span class="status-dot"></span> Live Sync
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- KPI Analytics Summary Bar -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">Total Items</div>
                <div class="kpi-value" id="totalSkus">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Total Stock Count</div>
                <div class="kpi-value" id="totalItems">0</div>
            </div>
        </div>

        <!-- Action & Search Bar -->
        <div class="control-panel">
            <div class="search-box-wrapper">
                <input type="text" id="searchInput" placeholder="Search product name, item number, or rack location...">
            </div>
            <button class="btn-dsv-primary" onclick="openAddModal()">
                + Add New Item
            </button>
            <button id="scanBtn" class="btn-dsv-secondary" onclick="toggleScanner()">
                📷 Scan QR Code
            </button>
        </div>

        <!-- Camera Scanner Modal Box -->
        <div id="qr-reader" class="qr-scanner-box"></div>

        <!-- Inventory List Card Grid -->
        <div id="inventoryList"></div>
    </main>

    <!-- Add Item Modal -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Inventory Item</h3>
                <button class="close-btn" onclick="closeAddModal()">&times;</button>
            </div>
            <form id="addForm" onsubmit="saveNewItem(event)">
                <div class="form-group">
                    <label for="addName">Item Name</label>
                    <input type="text" id="addName" placeholder="e.g. Branded Lanyard" required>
                </div>
                <div class="form-group">
                    <label for="addSku">Item Number</label>
                    <input type="text" id="addSku" placeholder="e.g. MKT-LAN-001" required>
                </div>
                <div class="form-group">
                    <label for="addRack">Rack Location</label>
                    <input type="text" id="addRack" placeholder="e.g. A1-02" required>
                </div>
                <div class="form-group">
                    <label for="addQty">Quantity</label>
                    <input type="number" id="addQty" value="0" min="0" required>
                </div>
                <div class="form-group">
                    <label for="addImageFile">Product Image (Optional)</label>
                    <input type="file" id="addImageFile" accept="image/*">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn-dsv-cancel" onclick="closeAddModal()">Cancel</button>
                    <button type="submit" id="saveAddBtn" class="btn-dsv-primary">Create Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Item Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Item Details</h3>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm" onsubmit="saveItemEdits(event)">
                <input type="hidden" id="editRecordId">
                
                <div class="form-group">
                    <label for="editName">Item Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label for="editSku">Item Number</label>
                    <input type="text" id="editSku" required>
                </div>
                <div class="form-group">
                    <label for="editRack">Rack Location</label>
                    <input type="text" id="editRack" required>
                </div>
                <div class="form-group">
                    <label for="editQty">Quantity</label>
                    <input type="number" id="editQty" min="0" required>
                </div>
                <div class="form-group">
                    <label for="editImageFile">Upload New Image</label>
                    <input type="file" id="editImageFile" accept="image/*">
                    <small style="color: var(--dsv-text-muted);">Leave empty to keep existing image.</small>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn-dsv-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" id="saveEditBtn" class="btn-dsv-secondary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
