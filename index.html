<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKT Storeroom Inventory</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <div class="container">
        <h1>📦 MKT Inventory 📦</h1>

        <!-- QR Scanner Controls -->
        <div style="text-align: center; margin-bottom: 15px;">
            <button id="scanBtn" onclick="toggleScanner()" style="padding: 10px 18px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;">
                📷 Scan QR Code
            </button>
            <div id="qr-reader" style="width: 100%; max-width: 350px; margin: 15px auto 0 auto; display: none; border: 2px solid #007bff; border-radius: 8px; overflow: hidden;"></div>
        </div>

        <!-- Search Bar -->
        <input type="text" id="searchInput" placeholder="Search by Product, SKU, or Rack...">

        <!-- Inventory List -->
        <div id="inventoryList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
