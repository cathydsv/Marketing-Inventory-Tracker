<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSV | Storeroom Inventory</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <!-- DSV Corporate Header Bar -->
    <header class="dsv-navbar">
        <div class="dsv-navbar-container">
            <div class="dsv-brand">
                <span class="dsv-logo-text">DSV</span>
                <span class="dsv-divider">|</span>
                <span class="dsv-subtitle">Global Transport & Logistics — Storeroom Management</span>
            </div>
            <div class="dsv-status-badge">
                <span class="status-dot"></span> Live Sync
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- KPI Analytics Summary Bar -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">Total SKUs</div>
                <div class="kpi-value" id="totalSkus">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Total Stock Count</div>
                <div class="kpi-value" id="totalItems">0</div>
            </div>
            <div class="kpi-card kpi-alert">
                <div class="kpi-label">Low Stock Alerts (&lt; 10)</div>
                <div class="kpi-value" id="lowStockCount">0</div>
            </div>
        </div>

        <!-- Action & Search Bar -->
        <div class="control-panel">
            <div class="search-box-wrapper">
                <input type="text" id="searchInput" placeholder="Search product name, SKU, or rack location...">
            </div>
            <button id="scanBtn" class="btn-dsv-secondary" onclick="toggleScanner()">
                📷 Scan QR Code
            </button>
        </div>

        <!-- Camera Scanner Modal Box -->
        <div id="qr-reader" class="qr-scanner-box"></div>

        <!-- Inventory List Card Grid -->
        <div id="inventoryList"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
